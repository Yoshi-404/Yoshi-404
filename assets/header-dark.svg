<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-terminal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="red-hanko" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Dither / Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#1e293b" stroke-width="0.8" opacity="0.4" />
    </pattern>

    <!-- Grid Dots Pattern -->
    <pattern id="retro-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#334155" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Base Window Frame -->
  <rect width="920" height="280" rx="12" fill="url(#bg-terminal)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="920" height="280" rx="12" fill="url(#retro-dots)" />
  <rect width="920" height="280" rx="12" fill="url(#scanlines)" />

  <!-- Terminal Window Top Bar -->
  <path d="M0 12C0 5.373 5.373 0 12 0h896c6.627 0 12 5.373 12 12v28H0V12z" fill="#0d1117" stroke="#1e293b" stroke-width="1" />
  <circle cx="24" cy="20" r="5" fill="#f43f5e" />
  <circle cx="42" cy="20" r="5" fill="#fbbf24" />
  <circle cx="60" cy="20" r="5" fill="#10b981" />
  <text x="460" y="24" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.5">yoshi-404@terminal: ~/portfolio/wakayama-ufgd</text>

  <!-- Large Watermark: 計算機工学 (Computer Engineering) -->
  <text x="890" y="215" text-anchor="end" font-family="'Hiragino Kaku Gothic Pro', 'Noto Sans JP', sans-serif" font-weight="900" font-size="115" fill="#38bdf8" opacity="0.035" letter-spacing="12">計算機工学</text>

  <!-- Hanko Seal (良典) in Cyber Red -->
  <g transform="translate(810, 58)">
    <rect width="66" height="66" rx="10" fill="#180c11" stroke="url(#red-hanko)" stroke-width="2" />
    <text x="33" y="28" text-anchor="middle" font-family="'Hiragino Mincho Pro', 'Noto Serif JP', serif" font-weight="700" font-size="20" fill="#f43f5e">良</text>
    <text x="33" y="53" text-anchor="middle" font-family="'Hiragino Mincho Pro', 'Noto Serif JP', serif" font-weight="700" font-size="20" fill="#f43f5e">典</text>
  </g>

  <!-- Breadcrumb / Academic Pill -->
  <g transform="translate(42, 58)">
    <rect width="270" height="26" rx="6" fill="#161f30" stroke="#2563eb" stroke-width="0.8" />
    <circle cx="14" cy="13" r="3.5" fill="#38bdf8" />
    <text x="26" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#93c5fd" letter-spacing="0.5">UFGD ⇄ 和歌山大学 (JAPAN)</text>
  </g>

  <!-- Main Name & Monospace Handle -->
  <text x="42" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="#f8fafc" letter-spacing="-0.8">
    Yan Yoshinori <tspan fill="url(#cyan-glow)" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="600">/ yoshi-404</tspan>
  </text>

  <!-- Subtitle / Roles -->
  <text x="42" y="165" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" fill="#94a3b8">
    Computer Engineering <tspan fill="#38bdf8">•</tspan> Creative Dev <tspan fill="#38bdf8">•</tspan> Graphics &amp; 3D Systems
  </text>

  <!-- Horizontal Tech Divider with Crosshairs -->
  <line x1="42" y1="190" x2="878" y2="190" stroke="#1e293b" stroke-width="1" />
  <circle cx="42" cy="190" r="2" fill="#38bdf8" />
  <circle cx="878" cy="190" r="2" fill="#38bdf8" />

  <!-- Dithered / Cyber Tech Pills -->
  <g transform="translate(42, 210)">
    <!-- Pill 1: JLPT N1 & TOEIC 840 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="6" fill="#1a141b" stroke="#f43f5e" stroke-width="1" />
      <text x="90" y="21.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fb7185">JLPT N1 • TOEIC 840</text>
    </g>

    <!-- Pill 2: 3D Graphics & OpenGL -->
    <g transform="translate(190, 0)">
      <rect width="145" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="72.5" y="21.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#cbd5e1">OpenGL • Pygame</text>
    </g>

    <!-- Pill 3: Mobile & Web -->
    <g transform="translate(345, 0)">
      <rect width="165" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="82.5" y="21.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#cbd5e1">Flutter • Next.js</text>
    </g>

    <!-- Pill 4: C++ & Python -->
    <g transform="translate(520, 0)">
      <rect width="125" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="62.5" y="21.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#cbd5e1">C++ • Python</text>
    </g>

    <!-- Pill 5: UI & Streetwear -->
    <g transform="translate(655, 0)">
      <rect width="160" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="80" y="21.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#94a3b8">UI/UX &amp; Streetwear</text>
    </g>
  </g>
</svg>
